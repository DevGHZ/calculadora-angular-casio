<main class="calculator-container">
  <div class="calculator-body">
    <!-- Branding -->
    <div class="brand">
      <span class="brand-name">CASIO</span>
      <span class="model-name">fx-991EX<br/>CLASSWIZ</span>
    </div>

    <!-- Screen -->
    <div class="screen-container">
      <div class="solar-panel">
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
        <div class="panel"></div>
      </div>
      <div class="screen">
        <div class="indicators">
          <span [class.active]="shiftActive()">S</span>
          <span [class.active]="alphaActive()">A</span>
          <span>M</span>
          <span>STO</span>
          <span>RCL</span>
          <span>STAT</span>
          <span>CMPLX</span>
          <span>MAT</span>
          <span>VCT</span>
          <span class="active">D</span>
          <span>R</span>
          <span>G</span>
        </div>
        <div class="expression-line">{{ expression() || ' ' }}</div>
        <div class="result-line">{{ result() }}</div>
      </div>
    </div>

    <!-- Keypad -->
    <div class="keypad">
      <!-- Top Function Keys -->
      <div class="function-keys">
        <!-- Row 1 -->
        <button class="key func-key shift" [class.toggled]="shiftActive()" (click)="toggleShift()">SHIFT</button>
        <button class="key func-key alpha" [class.toggled]="alphaActive()" (click)="toggleAlpha()">ALPHA</button>
        <div class="nav-pad">
          <button class="nav-btn up" (click)="calculate()">▲</button>
          <button class="nav-btn left" (click)="delete()">◄</button>
          <button class="nav-btn right" (click)="append('Ans')">►</button>
          <button class="nav-btn down" (click)="clear()">▼</button>
          <div class="nav-center"></div>
        </div>
        <button class="key func-key">SETUP</button>
        <button class="key func-key on" (click)="clear()">ON</button>

        <!-- Math Functions... -->
        <!-- Row 2 -->
        <button class="key math-key" (click)="appendFunction('calc')">CALC</button>
        <button class="key math-key" (click)="appendFunction('int')">∫dx</button>
        <button class="key math-key" (click)="append('x')"><i>x</i></button>
        <button class="key math-key" (click)="append('^-1')"><i>x</i>⁻¹</button>
        <button class="key math-key" (click)="appendFunction('log')">log_■</button>
        
        <!-- Row 3 -->
        <button class="key math-key" (click)="append('/')">■/□</button>
        <button class="key math-key" (click)="appendFunction('sqrt')">√</button>
        <button class="key math-key" (click)="append('^2')"><i>x</i>²</button>
        <button class="key math-key" (click)="append('^')"><i>x</i>■</button>
        <button class="key math-key" (click)="appendFunction('log(')">log</button>
        
        <!-- Row 4 -->
        <button class="key math-key" (click)="append('-')">(-)</button>
        <button class="key math-key" (click)="append('°')">°' "</button>
        <button class="key math-key" (click)="append('^-1')"><i>x</i>⁻¹</button>
        <button class="key math-key" (click)="appendFunction('sin')">sin</button>
        <button class="key math-key" (click)="appendFunction('cos')">cos</button>
        <button class="key math-key" (click)="appendFunction('tan')">tan</button>

        <!-- Row 5 -->
        <button class="key math-key" (click)="append('STO')">STO</button>
        <button class="key math-key" (click)="append('ENG')">ENG</button>
        <button class="key math-key" (click)="append('(')">(</button>
        <button class="key math-key" (click)="append(')')">)</button>
        <button class="key math-key" (click)="append('S<=>D')">S⇔D</button>
        <button class="key math-key" (click)="append('M+')">M+</button>
      </div>

      <!-- Basic Keys -->
      <div class="basic-keys">
        <button class="key num-key" (click)="append('7')">7</button>
        <button class="key num-key" (click)="append('8')">8</button>
        <button class="key num-key" (click)="append('9')">9</button>
        <button class="key action-key del" (click)="delete()">DEL</button>
        <button class="key action-key ac" (click)="clear()">AC</button>

        <button class="key num-key" (click)="append('4')">4</button>
        <button class="key num-key" (click)="append('5')">5</button>
        <button class="key num-key" (click)="append('6')">6</button>
        <button class="key op-key" (click)="append('*')">×</button>
        <button class="key op-key" (click)="append('/')">÷</button>

        <button class="key num-key" (click)="append('1')">1</button>
        <button class="key num-key" (click)="append('2')">2</button>
        <button class="key num-key" (click)="append('3')">3</button>
        <button class="key op-key" (click)="append('+')">+</button>
        <button class="key op-key" (click)="append('-')">-</button>

        <button class="key num-key" (click)="append('0')">0</button>
        <button class="key num-key" (click)="append('.')">.</button>
        <button class="key num-key" (click)="append('*10^')">×10ˣ</button>
        <button class="key num-key" (click)="append('Ans')">Ans</button>
        <button class="key eval-key" (click)="calculate()">=</button>
      </div>
    </div>
  </div>
</main>
